spring.application.name=demo
# Puerto del servidor (por defecto es 8080, podés cambiarlo si querés)
server.port=8080

# Configuración de logging (para ver qué pasa en la consola)
logging.level.org.springframework=INFO
logging.level.com.example.quiz=DEBUG

# Habilitar WebSocket (Spring lo hace automáticamente al usar WebSocketConfig)
spring.websocket.enabled=true

# Evitar cache en los recursos estáticos (útil durante desarrollo)
spring.web.resources.cache.period=0


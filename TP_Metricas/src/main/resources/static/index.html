<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game - Ingreso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="card p-4 shadow-lg" style="width: 22rem;">
    <h3 class="text-center mb-3">Quiz Game</h3>
    <form id="joinForm">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre y Apellido</label>
        <input type="text" id="name" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Participar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("joinForm");
    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      if (!name) return;

      // Guardamos el nombre para usar en game.html
      localStorage.setItem("playerName", name);

      // Conectamos al WebSocket y enviamos "join"
      const ws = new WebSocket("ws://localhost:8080/quiz");
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "join", name: name }));
        // Guardamos socket en sessionStorage para game.html
        sessionStorage.setItem("wsConnected", "true");
        ws.close();
        window.location.href = "game.html";
      };
      ws.onerror = () => alert("Error conectando al servidor");
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Bienvenido, <span id="playerName"></span></h2>

    <!-- Puntaje -->
    <div class="text-center mb-3">
      <h4>Puntos: <span id="score">0</span></h4>
    </div>

    <!-- Pregunta -->
    <div class="card p-4 shadow-lg mb-4">
      <h5 id="questionText">Esperando a que comience el juego...</h5>
      <div id="options" class="d-grid gap-2 mt-3"></div>
    </div>

    <!-- Temporizador -->
    <div class="text-center">
      <h5>Tiempo restante: <span id="timer">0</span> s</h5>
    </div>

    <!-- Podio -->
    <div id="podium" class="mt-5"></div>
  </div>

  <script>
    const name = localStorage.getItem("playerName");
    document.getElementById("playerName").textContent = name;

    let ws = new WebSocket("ws://localhost:8080/quiz");
    let currentQuestionId = null;
    let questionStartTime = null;
    let score = 0;
    let timerInterval;

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "join", name: name }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "joined") {
        console.log("Conectado al juego");
      }

      if (data.type === "question") {
        showQuestion(data);
      }

      if (data.type === "podium") {
        showPodium(data.top);
      }
    };

    function showQuestion(q) {
      currentQuestionId = q.id;
      questionStartTime = Date.now();
      document.getElementById("questionText").textContent = q.text;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn btn-outline-primary";
        btn.textContent = opt;
        btn.onclick = () => sendAnswer(idx);
        optionsDiv.appendChild(btn);
      });

      startTimer(8);
    }

    function sendAnswer(idx) {
      const elapsed = Date.now() - questionStartTime;
      ws.send(JSON.stringify({
        type: "answer",
        questionId: currentQuestionId,
        selectedIndex: idx,
        name: name,
        serverStart: questionStartTime
      }));
      clearInterval(timerInterval);
    }

    function startTimer(seconds) {
      let remaining = seconds;
      document.getElementById("timer").textContent = remaining;
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        remaining--;
        document.getElementById("timer").textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function showPodium(topList) {
      const div = document.getElementById("podium");
      div.innerHTML = "<h3>🏆 Podio Final</h3>";
      topList.forEach((p, i) => {
        div.innerHTML += `<p>${i+1}° - ${p.name}: ${p.points} puntos</p>`;
      });
    }
  </script>
</body>
</html>
